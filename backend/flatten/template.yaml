AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: TTB Label Validator — AI Flatten Lambda (OpenCV)

Globals:
  Function:
    Timeout: 30
    MemorySize: 2048
    Runtime: python3.11
    Architectures:
      - x86_64

Resources:
  FlattenFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ttb-ai-flatten
      CodeUri: .
      Handler: lambda_function.handler
      Description: Flatten bottle/angled label images using OpenCV cylindrical projection or perspective rectification
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - "*"
          AllowMethods:
            - POST
            - OPTIONS
          AllowHeaders:
            - Content-Type
      Environment:
        Variables:
          PYTHONPATH: /var/task

Outputs:
  FlattenFunctionUrl:
    Description: Lambda Function URL for AI Flatten
    Value: !GetAtt FlattenFunctionUrl.FunctionUrl
